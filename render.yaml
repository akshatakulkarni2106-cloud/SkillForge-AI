services:
  # -------------------------------------------------------------
  # 1. SkillForge Node.js / Express Backend
  # -------------------------------------------------------------
  - type: web
    name: skillforge-backend
    env: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/assessment/meta
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: skillforge-ai-service
          property: host
      - key: CLIENT_ORIGIN
        sync: false

  # -------------------------------------------------------------
  # 2. SkillForge Python / FastAPI AI Service
  # -------------------------------------------------------------
  - type: web
    name: skillforge-ai-service
    env: python
    rootDir: ai-service
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
